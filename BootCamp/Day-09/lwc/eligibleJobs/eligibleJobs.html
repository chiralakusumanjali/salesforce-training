<template>

    <!-- JOB LIST -->

    <div class="jobs-container">

        <h1 class="page-title">Available Jobs</h1>

        <template if:true={jobs}>

            <div class="jobs-grid">

                <template for:each={jobs} for:item="job">

                    <div class="job-card" key={job.Id}>

                        <lightning-card title={job.Name}>

                            <div class="slds-p-around_medium">

                                <p class="slds-m-bottom_small">
                                    <strong>Job Role:</strong>
                                    {job.Job_Role__c}
                                </p>

                                <p class="slds-m-bottom_small">
                                    <strong>Eligible Branch:</strong>
                                    {job.Eligible_Branch__c}
                                </p>

                                <p class="slds-m-bottom_small">
                                    <strong>Minimum CGPA:</strong>
                                    {job.Minimum_CGPA__c}
                                </p>

                                <p class="slds-m-bottom_small">
                                    <strong>Maximum Backlogs:</strong>
                                    {job.Maximum_Backlogs__c}
                                </p>

                                <p class="slds-m-bottom_small">
                                    <strong>Location:</strong>
                                    {job.Location__c}
                                </p>

                                <p class="slds-m-bottom_medium">
                                    <strong>Last Date:</strong>
                                    {job.Last_Date__c}
                                </p>


                                <!-- BUTTONS -->

                                <div>

                                    <!-- VIEW DETAILS -->

                                    <lightning-button
                                        label="View Details"
                                        variant="neutral"
                                        data-id={job.Id}
                                        onclick={handleViewDetails}>
                                    </lightning-button>


                                    <!-- APPLY -->

                                    <lightning-button
                                        class="slds-m-left_small"
                                        variant="brand"
                                        label={applyButtonLabel}
                                        data-job-id={job.Id}
                                        onclick={handleApply}
                                        disabled={isProcessing}>
                                    </lightning-button>

                                </div>


                                <!-- PROCESSING -->

                                <template if:true={isProcessing}>

                                    <div class="slds-m-top_medium">

                                        <lightning-spinner
                                            alternative-text="Submitting application"
                                            size="small">
                                        </lightning-spinner>

                                        <p class="slds-m-top_small">
                                            Submitting your application...
                                        </p>

                                    </div>

                                </template>

                            </div>

                        </lightning-card>

                    </div>

                </template>

            </div>

        </template>


        <!-- NO JOBS -->

        <template if:false={jobs}>

            <div class="no-jobs">

                <p>No jobs available.</p>

            </div>

        </template>

    </div>


    <!-- ================================= -->
    <!-- VIEW DETAILS -->
    <!-- ================================= -->

    <template if:true={showDetails}>

        <div class="details-box">

            <h2>
                {selectedJob.Name}
            </h2>

            <p>
                <strong>Job Role:</strong>
                {selectedJob.Job_Role__c}
            </p>

            <p>
                <strong>Eligible Branch:</strong>
                {selectedJob.Eligible_Branch__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                {selectedJob.Minimum_CGPA__c}
            </p>

            <p>
                <strong>Maximum Backlogs:</strong>
                {selectedJob.Maximum_Backlogs__c}
            </p>

            <p>
                <strong>Location:</strong>
                {selectedJob.Location__c}
            </p>

            <p>
                <strong>Last Date:</strong>
                {selectedJob.Last_Date__c}
            </p>


            <lightning-button
                label="Close"
                variant="neutral"
                onclick={closeDetails}>
            </lightning-button>

        </div>

    </template>

</template>
